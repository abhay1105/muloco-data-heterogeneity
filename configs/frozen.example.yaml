# Copy to configs/frozen.yaml at the end of Phase 1 (after Stage C) and fill in the tuned values.
# Flat keys apply to every method; `methods:` holds per-method overrides (EXPERIMENT_DESIGN.md §5.2).
# Phase 2 runs use ONLY these values -- do not edit after Phase 2 starts.
methods:
  dp_adamw:     {lr: 3.0e-3}                      # Stage A best
  dp_muon:      {lr: 3.0e-3, lr_muon: 3.0e-3}     # Stage A best (lr = AdamW part, fixed to dp_adamw best)
  diloco:       {lr: 3.0e-3, outer_lr: 0.7, outer_momentum: 0.9}   # Stage B/C best
  muloco:       {lr: 3.0e-3, lr_muon: 3.0e-3, outer_lr: 0.7, outer_momentum: 0.9}
  fedavg_adamw: {lr: 3.0e-3}                      # = diloco inner lr (outer fixed to 1.0 / 0.0)
  fedavg_muon:  {lr: 3.0e-3, lr_muon: 3.0e-3}     # = muloco inner lrs
